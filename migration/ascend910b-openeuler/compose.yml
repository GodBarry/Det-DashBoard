name: det-dashboard

services:
  postgres:
    image: postgres:16
    container_name: det-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DEPLOY_ROOT}/runtime/postgres:/var/lib/postgresql/data:Z
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [det-internal]

  minio:
    image: minio/minio:latest
    container_name: det-dashboard-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DEPLOY_ROOT}/runtime/minio:/data:Z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [det-internal]

  app:
    image: det-dashboard-app:arm64
    container_name: det-dashboard-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      APP_ROOT: /app
      DIST_ROOT: /app/dist
      HOST_PATH_MODE: posix
      DATA_ROOT: /data/data-root
      DATA_ROOT_DISPLAY: /data/data-root
      BROWSE_ROOT: /data/data-root
      BROWSE_ROOT_DISPLAY: /data/data-root
      STORAGE_ROOT: /data/cache
      FALLBACK_STORAGE_ROOT: /data/cache
      EXPORT_ROOT: /data/exports
      EXPORT_ROOT_DISPLAY: /data/exports
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TRAINING_WORKER_ENABLED: "false"
      INFERENCE_WORKER_ENABLED: "false"
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-5173}:5173"
    volumes:
      - ${DEPLOY_ROOT}/runtime/app:/data:Z
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [det-internal]

networks:
  det-internal:
    name: det-dashboard-internal
